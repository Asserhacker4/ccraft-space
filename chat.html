<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>CCRAFT SPACE | شات</title>
<link rel="stylesheet" href="styles.css">
<style>

/* ============================================================
   Chat Page Layout — Full Screen (Mobile Fixed)
   ============================================================ */

html, body {
    height: auto;
    margin: 0 !important;
    padding: 0 !important;
}

/* No position:fixed and no JS-calculated height here on purpose.
   Mobile browsers (Chrome/Safari) draw their own toolbar OVER
   fixed-positioned elements pinned to the screen edge, even when the
   height math is exactly right — that toolbar can visually cover the
   bottom of a fixed box with nothing the page can do about it, since
   it isn't a scrollable overflow, it's a physical viewport overlay.
   Sticky header/footer inside a normally-scrolling page sidesteps the
   whole problem: this is genuine scroll, so the browser manages its
   own UI chrome correctly, and nothing can end up trapped off-screen. */
body {
    min-height: 100svh;   /* smallest possible viewport — always visible */
    min-height: 100dvh;   /* refines to the live viewport where supported */
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
}

.chat-layout {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0;
    min-height: 100svh;
    min-height: 100dvh;
}


/* ============================================================
   Chat Header Bar
   ============================================================ */

.chat-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 30;
}

.back-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 6px;
    margin: 0;
    min-width: unset;
    flex-shrink: 0;
    line-height: 1;
    transition: var(--transition);
}

.back-btn:hover { color: var(--text-main); filter: none; transform: scale(1.1); }

.header-icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.15rem;
    cursor: pointer;
    padding: 4px 6px;
    margin: 0;
    min-width: unset;
    flex-shrink: 0;
    line-height: 1;
    transition: var(--transition);
}

.header-icon-btn:hover { color: var(--text-main); filter: none; transform: rotate(30deg) scale(1.1); }

.ch-icon {
    width: 40px; height: 40px;
    border-radius: 14px;
    background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    box-shadow: 0 4px 14px rgba(139,92,246,0.35);
    flex-shrink: 0;
}

.ch-info { flex: 1; min-width: 0; }
.ch-name { font-size: 0.95rem; font-weight: 900; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-status {
    font-size: 0.7rem;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 5px;
}

.ch-status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
    animation: blink 1.5s ease infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.ch-online {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    padding: 5px 10px;
    font-size: 0.68rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    white-space: nowrap;
}

.ch-online .dot { width:6px;height:6px;border-radius:50%;background:var(--success); }


/* ============================================================
   Messages Area
   ============================================================ */

#chatBox {
    flex: 1;
    -webkit-overflow-scrolling: touch;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
}

/* Date separator */
.date-sep {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 14px 0 8px;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-weight: 700;
}

.date-sep::before, .date-sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-color);
}

/* Message group */
.msg-group {
    display: flex;
    gap: 8px;
    margin-bottom: 2px;
    position: relative;
    max-width: 100%;
}

.msg-group.own {
    flex-direction: row-reverse;
}

/* Avatar */
.msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid rgba(139,92,246,0.25);
    flex-shrink: 0;
    background: #0a0a14;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    align-self: flex-end;
    font-size: 0.85rem;
    font-weight: 900;
    color: white;
}

.msg-group.own .msg-avatar { background: var(--accent-gradient); border-color: rgba(139,92,246,0.4); }
.msg-avatar:hover { transform: scale(1.12); border-color: var(--primary); }

/* Bubble column */
.msg-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: 78%;
    min-width: 0;
}

.msg-group.own .msg-col { align-items: flex-end; }

/* Username */
.msg-username {
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--primary);
    padding: 0 6px;
    cursor: pointer;
}

.msg-username:hover { text-decoration: underline; }
.msg-group.own .msg-username { display: none; }

/* Bubble */
.msg-bubble {
    position: relative;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 0.92rem;
    line-height: 1.6;
    word-break: break-word;
    max-width: 100%;
    transition: background 0.2s;
}

/* Others bubble */
.msg-group:not(.own) .msg-bubble {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-bottom-right-radius: 6px;
    color: var(--text-main);
}

/* Own bubble */
.msg-group.own .msg-bubble {
    background: var(--accent-gradient);
    color: white;
    border-bottom-left-radius: 6px;
    box-shadow: 0 4px 14px rgba(139,92,246,0.3);
}

.msg-bubble:hover { filter: brightness(1.05); }

.bubble-text { white-space: pre-wrap; word-break: break-word; }

/* Sticker bubble — no background/padding, just the image */
.msg-bubble.sticker-bubble {
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
}

/* Reply preview inside bubble */
.reply-preview {
    background: rgba(0,0,0,0.15);
    border-right: 3px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 0.75rem;
    opacity: 0.85;
}

.msg-group:not(.own) .reply-preview {
    border-right-color: var(--primary);
    background: rgba(139,92,246,0.08);
}

.reply-preview .rp-name { font-weight: 800; margin-bottom: 2px; color: var(--primary); }
.msg-group.own .reply-preview .rp-name { color: rgba(255,255,255,0.8); }
.reply-preview .rp-text { color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.msg-group.own .reply-preview .rp-text { color: rgba(255,255,255,0.7); }

/* Edited tag */
.edited-tag {
    font-size: 0.62rem;
    opacity: 0.6;
    margin-right: 4px;
}

/* Sent images */
.msg-image-img {
    display: block;
    max-width: 240px;
    max-height: 320px;
    width: 100%;
    height: auto;
    border-radius: 14px;
    cursor: pointer;
    object-fit: cover;
}

/* Stickers */
.msg-sticker-img {
    display: block;
    width: 120px;
    height: 120px;
    object-fit: contain;
    cursor: pointer;
}

/* Mentions inside message text */
.mention {
    color: var(--primary);
    font-weight: 800;
    background: rgba(139,92,246,0.15);
    padding: 1px 5px;
    border-radius: 6px;
    unicode-bidi: plaintext;
}

.msg-group.own .mention { background: rgba(255,255,255,0.2); color: #fff; }

.mention-me {
    background: rgba(250,204,21,0.28) !important;
    color: #fbbf24 !important;
}

.msg-bubble.mention-glow {
    box-shadow: 0 0 0 2px rgba(250,204,21,0.65), 0 4px 14px rgba(250,204,21,0.25);
}

/* @mention autocomplete panel */
.mention-panel {
    position: absolute;
    bottom: 78px;
    right: 10px;
    left: 10px;
    margin: 0 auto;
    max-width: 320px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    max-height: 200px;
    overflow-y: auto;
    display: none;
    z-index: 60;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
}

.mention-panel.show { display: block; }

.mention-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text-main);
}

.mention-item:hover { background: rgba(139,92,246,0.12); }

.mi-avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem;
    font-weight: 900;
    color: white;
    flex-shrink: 0;
}

/* Code blocks inside messages */
.code-block {
    margin: 6px 0;
    border-radius: 12px;
    overflow: hidden;
    background: #0d0d18;
    border: 1px solid rgba(139,92,246,0.25);
    max-width: 100%;
}

.code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: rgba(139,92,246,0.12);
    font-size: 0.68rem;
    font-weight: 800;
    direction: ltr;
}

.code-lang {
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.code-copy-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-main);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 0.66rem;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    transition: var(--transition);
    min-width: unset;
    margin: 0;
}

.code-copy-btn:hover { background: rgba(139,92,246,0.25); filter: none; transform: none; }
.code-copy-btn.copied { background: rgba(16,185,129,0.25); border-color: rgba(16,185,129,0.4); color: #10b981; }

.code-block pre {
    margin: 0;
    padding: 10px 12px;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 260px;
    direction: ltr;
    text-align: left;
}

.code-block code {
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 0.78rem;
    line-height: 1.5;
    color: #d6d6f5;
    white-space: pre;
}

/* Meta row (time + status) */
.msg-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px;
}

.msg-group.own .msg-meta { flex-direction: row-reverse; }

.msg-time { font-size: 0.65rem; color: var(--text-muted); }
.msg-read  { font-size: 0.7rem; color: var(--secondary); }

/* Reactions */
.msg-reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 0 4px;
}

.reaction-pill {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    padding: 3px 8px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
}

.reaction-pill:hover { border-color: var(--primary); background: var(--primary-dim); transform: scale(1.1); }
.reaction-pill.mine  { border-color: var(--primary); background: var(--primary-dim); color: var(--primary); }
.reaction-pill .rp-count { font-size: 0.7rem; font-weight: 800; }

/* Hover actions (also tap-to-show on mobile via .show class) */
.msg-actions-hover {
    position: absolute;
    top: -34px;
    display: none;
    align-items: center;
    gap: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    padding: 4px 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 10;
    white-space: nowrap;
}

.msg-group.own .msg-actions-hover { left: 0; right: auto; }
.msg-group:not(.own) .msg-actions-hover { right: 0; left: auto; }

.msg-bubble:hover .msg-actions-hover,
.msg-col:hover .msg-actions-hover,
.msg-actions-hover.show { display: flex; }

.act-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    padding: 0;
    margin: 0;
    color: var(--text-muted);
    min-width: unset;
}

.act-btn:hover { background: rgba(139,92,246,0.15); color: var(--text-main); transform: scale(1.15); filter: none; }

/* Emoji picker */
.emoji-picker {
    position: absolute;
    top: -44px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 6px 10px;
    display: none;
    gap: 6px;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 90vw;
    overflow-x: auto;
}

.emoji-picker.show { display: flex; }
.emoji-opt { font-size: 1.2rem; cursor: pointer; transition: transform 0.15s; padding: 2px; border-radius: 6px; }
.emoji-opt:hover { transform: scale(1.35); background: rgba(139,92,246,0.1); }

/* System message */
.sys-msg {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    padding: 6px 0;
    font-weight: 700;
}


/* ============================================================
   Reply Bar (above input)
   ============================================================ */

#replyBar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(139,92,246,0.06);
    border-top: 1px solid rgba(139,92,246,0.2);
    font-size: 0.8rem;
    flex-shrink: 0;
}

.rb-text { flex: 1; color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rb-text strong { color: var(--primary); }
.rb-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; margin: 0; padding: 0; }
.rb-close:hover { color: var(--danger); filter: none; transform: none; }


/* ============================================================
   Upload Preview Bar (image about to be sent)
   ============================================================ */

#uploadBar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(139,92,246,0.06);
    border-top: 1px solid rgba(139,92,246,0.2);
    font-size: 0.8rem;
    flex-shrink: 0;
}

#uploadBar img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
.ub-text { flex: 1; color: var(--text-muted); }
.ub-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; margin: 0; padding: 0; }
.ub-close:hover { color: var(--danger); filter: none; transform: none; }


/* ============================================================
   Typing Indicator
   ============================================================ */

#typingBar {
    padding: 4px 20px;
    font-size: 0.75rem;
    color: var(--text-muted);
    min-height: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.typing-dots { display: flex; gap: 4px; }
.typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); animation: tdot 1.2s ease infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot { 0%,60%,100%{opacity:0.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-4px)} }


/* ============================================================
   Input Area
   ============================================================ */

.input-area {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg-card);
    border-top: 1px solid var(--border-color);
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    z-index: 30;
}

.input-wrap {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 22px;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 8px 12px;
    transition: var(--transition);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
    min-width: 0;
}

.input-wrap:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15), inset 0 2px 6px rgba(0,0,0,0.2);
}

#msgInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-main);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    line-height: 1.5;
    resize: none;
    max-height: 120px;
    overflow-y: auto;
    direction: rtl;
    min-width: 0;
}

#msgInput::placeholder { color: var(--text-muted); opacity: 0.7; }

.emoji-trigger, .media-trigger {
    background: none;
    border: none;
    font-size: 1.15rem;
    cursor: pointer;
    padding: 0;
    margin: 0;
    color: var(--text-muted);
    transition: var(--transition);
    flex-shrink: 0;
    min-width: unset;
    line-height: 1;
}

.emoji-trigger:hover, .media-trigger:hover { color: var(--text-main); transform: scale(1.2); filter: none; }

.input-side-btns {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding-bottom: 2px;
}

.quick-emojis {
    position: absolute;
    bottom: 78px;
    right: 10px;
    left: 10px;
    margin: 0 auto;
    max-width: 320px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 10px 14px;
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    z-index: 50;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    max-height: 40vh;
    overflow-y: auto;
}

.quick-emojis.show { display: flex; }
.q-emoji { font-size: 1.4rem; cursor: pointer; transition: transform 0.15s; border-radius: 8px; padding: 3px; }
.q-emoji:hover { transform: scale(1.3); background: rgba(139,92,246,0.1); }

/* Send button */
#sendBtn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent-gradient);
    color: white;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(139,92,246,0.4);
    transition: var(--transition);
    flex-shrink: 0;
    margin: 0;
    padding: 0;
    min-width: unset;
}

#sendBtn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(139,92,246,0.5); filter: none; }
#sendBtn:active { transform: scale(0.94); }
#sendBtn:disabled { opacity: 0.4; transform: none; }

/* Scroll to bottom button */
#scrollBtn {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent-gradient);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    box-shadow: 0 4px 14px rgba(139,92,246,0.4);
    display: none;
    gap: 6px;
    align-items: center;
    margin: 0;
    z-index: 40;
    animation: fadeIn 0.3s ease both;
}

#scrollBtn.show { display: flex; }

/* ============================================================
   Image Lightbox (full-screen viewer with pinch/double-tap zoom)
   ============================================================ */

.lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
}

.lightbox-overlay.show { display: flex; }

.lightbox-close {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top));
    left: 16px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 2;
    margin: 0; padding: 0;
}

.lightbox-close:hover { background: rgba(255,255,255,0.2); filter: none; transform: none; }

.lightbox-stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
}

.lightbox-stage img {
    max-width: 96vw;
    max-height: 92vh;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
    touch-action: none;
}

.lightbox-hint {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom));
    color: rgba(255,255,255,0.5);
    font-size: 0.75rem;
    text-align: center;
    width: 100%;
    pointer-events: none;
}


/* ============================================================
   Sticker Panel (your saved stickers)
   ============================================================ */

.sticker-panel {
    position: absolute;
    bottom: 78px;
    right: 10px;
    left: 10px;
    margin: 0 auto;
    max-width: 340px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 12px 14px;
    display: none;
    flex-direction: column;
    gap: 10px;
    z-index: 50;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    max-height: 46vh;
}

.sticker-panel.show { display: flex; }

.sticker-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-muted);
    flex-shrink: 0;
}

.sticker-add-btn {
    background: var(--primary-dim);
    color: var(--primary);
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 50px;
    padding: 5px 12px;
    font-size: 0.72rem;
    font-weight: 800;
    cursor: pointer;
    margin: 0;
}

.sticker-add-btn:hover { background: var(--primary); color: white; filter: none; transform: none; }

.sticker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    overflow-y: auto;
}

.sticker-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: var(--transition);
}

.sticker-item:hover { border-color: var(--border-hover); transform: scale(1.05); }

.sticker-item img { width: 100%; height: 100%; object-fit: contain; display: block; }

.sticker-del-btn {
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    font-size: 0.6rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    margin: 0; padding: 0;
    min-width: unset;
}

.sticker-empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.78rem;
    padding: 20px 4px;
    line-height: 1.7;
}


/* ============================================================
   Chat Settings Modal (message bubble shape — TikTok style)
   ============================================================ */

.settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 500;
}

.settings-overlay.show { display: flex; }

.settings-panel {
    width: 100%;
    max-width: 480px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 24px 24px 0 0;
    padding: 20px 22px calc(24px + env(safe-area-inset-bottom));
    animation: fadeIn 0.25s ease both;
}

.settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.settings-header h3 {
    font-size: 1.05rem;
    font-weight: 900;
    color: var(--text-main);
}

.settings-close {
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--text-muted);
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    margin: 0; padding: 0;
    min-width: unset;
}

.settings-close:hover { color: var(--text-main); filter: none; transform: none; }

.shape-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.shape-option {
    background: var(--bg-surface);
    border: 2px solid var(--border-color);
    border-radius: 16px;
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    cursor: pointer;
    transition: var(--transition);
}

.shape-option:hover { border-color: var(--border-hover); }
.shape-option.active { border-color: var(--primary); background: var(--primary-dim); }

.shape-preview-bubble {
    background: var(--accent-gradient);
    color: white;
    padding: 8px 14px;
    font-size: 0.75rem;
    font-weight: 700;
    max-width: 90%;
}

.shape-option .shape-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 700;
    align-self: center;
}

.shape-option.active .shape-label { color: var(--primary); }

.shape-preview-bubble.p-rounded { border-radius: 18px; border-bottom-left-radius: 6px; }
.shape-preview-bubble.p-square  { border-radius: 8px; }
.shape-preview-bubble.p-pill    { border-radius: 999px; }
.shape-preview-bubble.p-soft    { border-radius: 20px; }


/* ============================================================
   Bubble Shape Variants — applied via body class from settings
   (default "rounded" needs no class; it's the existing look)
   ============================================================ */

body.shape-square .msg-bubble { border-radius: 8px !important; }

body.shape-pill .msg-bubble { border-radius: 999px !important; }

body.shape-soft .msg-bubble { border-radius: 20px !important; }


/* ============================================================
   Responsive — phones
   ============================================================ */

@media (max-width: 600px) {
    .chat-header { padding: 10px 12px; gap: 8px; }
    .back-btn { font-size: 1.1rem; padding: 2px 4px; }
    .ch-icon { width: 36px; height: 36px; font-size: 1.05rem; border-radius: 12px; }
    .ch-name { font-size: 0.88rem; }
    .ch-online span#onlineCount { }
    #chatBox { padding: 10px 8px; gap: 3px; }
    .msg-col { max-width: 86%; }
    .msg-avatar { width: 28px; height: 28px; }
    .msg-bubble { padding: 8px 12px; font-size: 0.88rem; }
    .quick-emojis { right: 6px; left: 6px; bottom: 74px; }
    .msg-image-img { max-width: 190px; max-height: 260px; }
    .msg-sticker-img { width: 100px; height: 100px; }
    .code-block code { font-size: 0.72rem; }
    .code-block pre { max-height: 200px; }
    .input-area { padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); }
    #sendBtn { width: 40px; height: 40px; font-size: 1rem; }
    .sticker-panel { right: 6px; left: 6px; bottom: 74px; }
    .sticker-grid { grid-template-columns: repeat(3, 1fr); }
    .shape-grid { grid-template-columns: 1fr; }
}

@media (max-width: 380px) {
    .msg-col { max-width: 90%; }
    .ch-online { display: none; }
}

</style>

<script type="module">
import { get, getApp, getApps, getAuth, getDatabase, initializeApp, onAuthStateChanged, onChildAdded, onValue, push, ref, remove, serverTimestamp, set, update } from "./supabase-config.js";







const app  = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);

let currentUser  = null;
let myUsername   = 'cCraft Space User'; // ✅ اسم المستخدم الحقيقي المحفوظ في البروفايل — مش الإيميل خالص
let replyTo      = null;  // { key, username, text }
let editingKey   = null;  // key of message being edited
let avatarCache  = {};    // uid -> photo dataURL أو null (لو مفيش صورة)
let lastDate     = null;
let typingTimer  = null;
let atBottom     = true;
let pendingUpload = null; // { dataURL, type: 'image'|'sticker' }
let userStickers  = {};   // id -> dataURL, your saved sticker library
let currentShape  = 'rounded'; // selected message bubble shape

const chatBox    = document.getElementById('chatBox');
const msgInput   = document.getElementById('msgInput');
const sendBtn    = document.getElementById('sendBtn');
const replyBar   = document.getElementById('replyBar');
const replyText  = document.getElementById('replyText');
const typingBar  = document.getElementById('typingBar');
const scrollBtn  = document.getElementById('scrollBtn');
const uploadBar  = document.getElementById('uploadBar');
const uploadText = document.getElementById('uploadText');
const uploadPreviewImg = document.getElementById('uploadPreviewImg');
const imageInput = document.getElementById('imageInput');
const stickerInput = document.getElementById('stickerInput');
const mentionPanel = document.getElementById('mentionPanel');
let mentionStart = -1; // index of '@' that the current suggestion list refers to

const EMOJIS = ['😂','😍','🔥','👍','💎','🚀','😎','🤩','😭','💀','🥶','🤯','👑','💜','⚡','🎮','🏆','🎯','💯','🌟','❤️','✨','🫡','🤝','🎉'];
const REACT_EMOJIS = ['👍','❤️','😂','🔥','💎','👑'];

// Max dimensions / quality used for compression
const IMAGE_MAX_DIM   = 1280;
const IMAGE_QUALITY   = 0.7;
const STICKER_MAX_DIM = 300;
const STICKER_QUALITY = 0.85;
const MAX_DATA_LENGTH = 900000; // ~ safety cap on the base64 payload size
const MAX_TEXT_LENGTH = 1500;   // يطابق حد الطول في Firebase Rules

/* ============================================================
   Anti-Spam: Send Cooldown
   ============================================================
   الحماية الحقيقية اتعملت في Firebase Rules (users/$uid/lastMessageTs
   لازم يتحدّث في نفس عملية الكتابة، وبفاصل 2.9 ثانية على الأقل بين كل
   تحديث والتاني — ده بيتفرض من السيرفر نفسه، مش بس من الكود ده، فحتى
   لو حد بعت طلبات مباشرة لقاعدة البيانات من برّه الموقع، هيترفض).
   الكود هنا طبقة تجربة استخدام إضافية بس (تعطيل الزرار + عدّاد) عشان
   المستخدم العادي ياخد فيدباك واضح، مش عشان تمنع سبام متعمّد بمفردها. */
const SEND_COOLDOWN_MS = 2900;
let lastSendAt = 0;
let cooldownTimer = null;
const originalPlaceholder = msgInput.placeholder;

function startCooldownUI() {
    lastSendAt = Date.now();
    sendBtn.disabled = true;
    tickCooldown();
}

function tickCooldown() {
    clearTimeout(cooldownTimer);
    const remaining = SEND_COOLDOWN_MS - (Date.now() - lastSendAt);
    if (remaining <= 0) {
        sendBtn.disabled = false;
        if (!editingKey) msgInput.placeholder = originalPlaceholder;
        return;
    }
    const secs = (remaining / 1000).toFixed(1);
    if (!editingKey) msgInput.placeholder = `⏳ استنى ${secs} ثانية قبل الرسالة الجاية...`;
    cooldownTimer = setTimeout(tickCooldown, 100);
}

function isOnCooldown() {
    return Date.now() - lastSendAt < SEND_COOLDOWN_MS;
}

// UX-only nicety: warns the user before they send an obviously-spammy message
// (same character/emoji repeated 8+ times). The 'u' flag matters here — without
// it "." only matches half of a two-unit emoji like 🔥, so the check silently
// never fires. NOTE: this is client-side feedback only, not real protection —
// a modified/forged client could skip it entirely. The actual protection
// against flooding is the 2.9s server-enforced interval in the Firebase Rules.
function looksLikeCharSpam(str) {
    return /^(.)\1{7,}$/u.test(str);
}


/* ============================================================
   Auth
   ============================================================ */

onAuthStateChanged(auth, async user => {
    if (!user) { alert('يجب تسجيل الدخول'); location.href='login.html'; return; }
    currentUser = user;

    // ✅ اسم المستخدم الحقيقي بيتجاب من البروفايل، مش من الإيميل خالص
    let hasUsername = false;
    try {
        const nameSnap = await get(ref(db, `users/${user.uid}/username`));
        if (nameSnap.exists() && nameSnap.val()) {
            myUsername = nameSnap.val();
            hasUsername = true;
        }
    } catch (e) { /* لو التحقق فشل، هنكمل بالاسم الافتراضي */ }

    // 🚧 لسه ما اختارش اسم مستخدم — لازم يختار الأول قبل ما يدخل الشات بأي اسم
    if (!hasUsername) {
        location.href = 'profile.html';
        return;
    }

    registerUser(user.uid, myUsername);
    buildQuickEmojis();
    loadChat();
    trackPresence(user);
    trackTyping(user);
    loadStickers();
    loadBubbleShape();
});


/* ============================================================
   Quick Emoji Panel
   ============================================================ */

function buildQuickEmojis() {
    const panel = document.getElementById('quickEmojis');
    panel.innerHTML = EMOJIS.map(e => `<span class="q-emoji">${e}</span>`).join('');
    panel.querySelectorAll('.q-emoji').forEach(el => {
        el.onclick = () => {
            msgInput.value += el.textContent;
            msgInput.focus();
            panel.classList.remove('show');
        };
    });
}

document.getElementById('emojiTrigger').onclick = () => {
    document.getElementById('quickEmojis').classList.toggle('show');
    document.getElementById('stickerPanel').classList.remove('show');
};

document.addEventListener('click', e => {
    if (!e.target.closest('#quickEmojis') && !e.target.closest('#emojiTrigger'))
        document.getElementById('quickEmojis').classList.remove('show');
});


/* ============================================================
   Avatar Helper
   ============================================================ */

function initialsAvatarHTML(name, size) {
    const initial = (name || '?').charAt(0).toUpperCase();
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:${size*0.35}px">${initial}</div>`;
}

async function getAvatar(uid, size = 34, name = '') {
    if (!uid) return initialsAvatarHTML(name, size);
    if (avatarCache[uid] !== undefined) {
        return avatarCache[uid]
            ? `<img src="${avatarCache[uid]}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block">`
            : initialsAvatarHTML(name, size);
    }
    try {
        const snap = await get(ref(db, `users/${uid}/photo`));
        const photo = snap.exists() ? snap.val() : null;
        avatarCache[uid] = photo;
        return photo
            ? `<img src="${photo}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block">`
            : initialsAvatarHTML(name, size);
    } catch {
        return initialsAvatarHTML(name, size);
    }
}


/* ============================================================
   Code block + text rendering
   ============================================================ */

// Map common language aliases to a clean display label
const LANG_LABELS = {
    js:'JavaScript', javascript:'JavaScript', ts:'TypeScript', typescript:'TypeScript',
    py:'Python', python:'Python', html:'HTML', css:'CSS', json:'JSON',
    java:'Java', c:'C', cpp:'C++', 'c++':'C++', cs:'C#', csharp:'C#',
    php:'PHP', sql:'SQL', bash:'Bash', sh:'Shell', shell:'Shell',
    swift:'Swift', kotlin:'Kotlin', go:'Go', rust:'Rust', ruby:'Ruby',
    xml:'XML', yaml:'YAML', yml:'YAML', dart:'Dart', txt:'Text', text:'Text'
};

// Registry of every username we've ever seen (from messages + presence),
// used to power @mention autocomplete and to know which @word is a real mention
const knownUsers = new Map(); // uid -> username

function registerUser(uid, username) {
    if (uid && username) knownUsers.set(uid, username);
}

function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function linkifyMentions(escapedText) {
    // escapedText is already HTML-escaped; usernames are plain ASCII so this is safe to run after escaping
    return escapedText.replace(/@([A-Za-z0-9_.\-]+)/g, (full, uname) => {
        let isMe = false, isKnown = false;
        for (const [uid, name] of knownUsers) {
            if (name.toLowerCase() === uname.toLowerCase()) {
                isKnown = true;
                if (currentUser && uid === currentUser.uid) isMe = true;
            }
        }
        if (!isKnown) return full;
        return `<span class="mention${isMe ? ' mention-me' : ''}">@${uname}</span>`;
    });
}

function renderMessageContent(text) {
    if (!text) return '';
    const regex = /```(\w+)?[ \t]*\n?([\s\S]*?)```/g;
    let lastIndex = 0, html = '', match, found = false;
    while ((match = regex.exec(text)) !== null) {
        found = true;
        const before = text.slice(lastIndex, match.index);
        if (before) html += `<span class="msg-text-part">${linkifyMentions(escapeHTML(before))}</span>`;
        const rawLang = (match[1] || '').toLowerCase();
        const label = LANG_LABELS[rawLang] || (rawLang ? rawLang : 'نص عادي');
        const code = match[2].replace(/\n$/, '');
        html += `
            <div class="code-block">
                <div class="code-block-header">
                    <span class="code-lang">${escapeHTML(label)}</span>
                    <button class="code-copy-btn" type="button">📋 نسخ</button>
                </div>
                <pre><code>${escapeHTML(code)}</code></pre>
            </div>`;
        lastIndex = regex.lastIndex;
    }
    const after = text.slice(lastIndex);
    if (after) html += `<span class="msg-text-part">${linkifyMentions(escapeHTML(after))}</span>`;
    return found ? html : linkifyMentions(escapeHTML(text));
}

// Single delegated listener handles copy buttons for every code block ever rendered
chatBox.addEventListener('click', async e => {
    const imgEl = e.target.closest('.msg-image-img, .msg-sticker-img');
    if (imgEl) { openLightbox(imgEl.src); return; }

    const btn = e.target.closest('.code-copy-btn');
    if (!btn) return;
    const codeEl = btn.closest('.code-block')?.querySelector('code');
    if (!codeEl) return;
    try {
        await navigator.clipboard.writeText(codeEl.textContent);
    } catch {
        // fallback for older/insecure contexts
        const ta = document.createElement('textarea');
        ta.value = codeEl.textContent;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch {}
        ta.remove();
    }
    const old = btn.textContent;
    btn.textContent = '✅ تم النسخ';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1500);
});


/* ============================================================
   Load Chat
   ============================================================ */

function loadChat() {
    onChildAdded(ref(db, 'chat'), async snapshot => {
        const msg = snapshot.val();
        const key = snapshot.key;
        if (!msg) return;

        const date    = msg.timestamp ? new Date(msg.timestamp) : new Date();
        const dateStr = date.toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long' });

        if (dateStr !== lastDate) {
            lastDate = dateStr;
            const sep = document.createElement('div');
            sep.className = 'date-sep';
            sep.textContent = dateStr;
            chatBox.appendChild(sep);
        }

        const avatarHTML = await getAvatar(msg.userId, 32, msg.username);
        const isOwn = msg.userId === currentUser.uid;
        const time  = date.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
        registerUser(msg.userId, msg.username);

        const el = document.createElement('div');
        el.className = `msg-group ${isOwn ? 'own' : ''}`;
        el.dataset.key = key;
        el.dataset.uid = msg.userId || '';

        el.innerHTML = buildMessageHTML(msg, key, isOwn, avatarHTML, time);
        chatBox.appendChild(el);

        attachActions(el, msg, key, isOwn);

        if (atBottom) scrollToBottom();
        else scrollBtn.classList.add('show');
    });

    // Listen for updates (edits/reactions)
    onValue(ref(db, 'chat'), snapshot => {
        if (!snapshot.exists()) return;
        snapshot.forEach(child => {
            const key = child.key;
            const msg = child.val();
            const el  = chatBox.querySelector(`[data-key="${key}"]`);
            if (!el) return;
            // Update reactions
            const reactDiv = el.querySelector('.msg-reactions');
            if (reactDiv) reactDiv.innerHTML = buildReactionsHTML(msg.reactions||{}, key);
            // Mark edited
            const editedTag = el.querySelector('.edited-tag');
            if (editedTag && msg.edited) editedTag.style.display = 'inline';
            // Update text (re-render so ```code``` blocks stay live after an edit)
            const textEl = el.querySelector('.bubble-text');
            if (textEl && msg.type !== 'sticker') textEl.innerHTML = renderMessageContent(msg.text || '');
        });
    });
}

function buildMessageHTML(msg, key, isOwn, avatarHTML, time) {
    const replyHTML = msg.replyTo ? `
        <div class="reply-preview">
            <div class="rp-name">↩️ ${msg.replyTo.username}</div>
            <div class="rp-text">${escapeHTML(msg.replyTo.text || '')}</div>
        </div>
    ` : '';

    const reactionsHTML = buildReactionsHTML(msg.reactions||{}, key);
    const editedHTML = msg.edited ? '<span class="edited-tag">(معدّل)</span>' : '<span class="edited-tag" style="display:none">(معدّل)</span>';
    const isMedia = msg.type === 'image' || msg.type === 'sticker';

    const myUsernameLower = (myUsername || '').toLowerCase();
    const mentionsMe = !isOwn && myUsernameLower && msg.text &&
        new RegExp(`(^|\\s)@${escapeRegex(myUsernameLower)}(\\s|$)`, 'i').test(msg.text + ' ');

    let contentHTML;
    if (msg.type === 'sticker') {
        contentHTML = `<img src="${msg.imageData}" class="msg-sticker-img" alt="ملصق">`;
    } else if (msg.type === 'image') {
        contentHTML = `
            ${replyHTML}
            <img src="${msg.imageData}" class="msg-image-img" alt="صورة">
            ${msg.text ? `<div class="bubble-text" style="margin-top:8px">${renderMessageContent(msg.text)}</div>` : ''}
            ${editedHTML}
        `;
    } else {
        contentHTML = `
            ${replyHTML}
            <div class="bubble-text">${renderMessageContent(msg.text || '')}</div>
            ${editedHTML}
        `;
    }

    return `
        <div class="msg-avatar" onclick="location.href='profile.html?uid=${msg.userId}'">${avatarHTML}</div>
        <div class="msg-col">
            ${!isOwn ? `<div class="msg-username" onclick="location.href='profile.html?uid=${msg.userId}'">${msg.username || 'cCraft Space User'}</div>` : ''}
            <div class="msg-bubble ${msg.type === 'sticker' ? 'sticker-bubble' : ''} ${mentionsMe ? 'mention-glow' : ''}">
                <div class="msg-actions-hover">
                    <div class="emoji-picker" id="ep-${key}">
                        ${REACT_EMOJIS.map(e=>`<span class="emoji-opt" data-emoji="${e}" data-key="${key}">${e}</span>`).join('')}
                    </div>
                    <button class="act-btn react-btn" data-key="${key}" title="تفاعل">😊</button>
                    <button class="act-btn reply-btn" data-key="${key}" title="رد">↩️</button>
                    ${isOwn && !isMedia ? `<button class="act-btn edit-btn" data-key="${key}" title="تعديل">✏️</button>` : ''}
                    ${isOwn ? `<button class="act-btn del-btn" data-key="${key}" title="حذف">🗑️</button>` : ''}
                </div>
                ${contentHTML}
            </div>
            <div class="msg-reactions">${reactionsHTML}</div>
            <div class="msg-meta">
                <span class="msg-time">${time}</span>
                ${isOwn ? '<span class="msg-read">✓✓</span>' : ''}
            </div>
        </div>
    `;
}

function buildReactionsHTML(reactions, key) {
    if (!reactions || !Object.keys(reactions).length) return '';
    const counts = {};
    const myReacts = new Set();
    Object.entries(reactions).forEach(([uid, emoji]) => {
        counts[emoji] = (counts[emoji]||0) + 1;
        if (uid === currentUser?.uid) myReacts.add(emoji);
    });
    return Object.entries(counts).map(([emoji, count]) =>
        `<span class="reaction-pill ${myReacts.has(emoji)?'mine':''}" data-emoji="${emoji}" data-key="${key}">
            ${emoji} <span class="rp-count">${count}</span>
        </span>`
    ).join('');
}


/* ============================================================
   Attach Actions
   ============================================================ */

function attachActions(el, msg, key, isOwn) {
    // On touch devices, tapping the bubble toggles the action bar
    el.querySelector('.msg-bubble')?.addEventListener('click', e => {
        if (e.target.closest('.act-btn') || e.target.closest('.code-copy-btn') || e.target.closest('img')) return;
        el.querySelectorAll('.msg-actions-hover').forEach(bar => bar.classList.toggle('show'));
    });

    // React button
    el.querySelector('.react-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        const picker = document.getElementById(`ep-${key}`);
        if (picker) picker.classList.toggle('show');
    });

    // Emoji options
    el.querySelectorAll('.emoji-opt').forEach(opt => {
        opt.addEventListener('click', async e => {
            e.stopPropagation();
            await toggleReaction(key, opt.dataset.emoji);
            document.getElementById(`ep-${key}`)?.classList.remove('show');
        });
    });

    // Reaction pills (click to toggle)
    el.querySelector('.msg-reactions')?.addEventListener('click', async e => {
        const pill = e.target.closest('.reaction-pill');
        if (pill) await toggleReaction(pill.dataset.key, pill.dataset.emoji);
    });

    // Reply
    el.querySelector('.reply-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        const previewText = msg.text || (msg.type === 'image' ? '📷 صورة' : msg.type === 'sticker' ? '🎨 ملصق' : '');
        replyTo = { key, username: msg.username, text: previewText };
        replyBar.style.display = 'flex';
        replyText.innerHTML = `<strong>${msg.username}</strong>: ${escapeHTML(previewText).slice(0,60)}`;
        msgInput.focus();
    });

    // Edit
    el.querySelector('.edit-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        editingKey   = key;
        msgInput.value = msg.text || '';
        msgInput.focus();
        msgInput.style.borderColor = 'var(--secondary)';
        msgInput.placeholder = '✏️ جارٍ التعديل...';
        autoResize();
    });

    // Delete
    el.querySelector('.del-btn')?.addEventListener('click', async e => {
        e.stopPropagation();
        if (!confirm('حذف هذه الرسالة؟')) return;
        await remove(ref(db, `chat/${key}`));
        el.style.cssText += 'opacity:0;transform:scale(0.9);transition:0.3s';
        setTimeout(() => el.remove(), 300);
    });

    // Close emoji picker on outside click
    document.addEventListener('click', e => {
        if (!e.target.closest(`#ep-${key}`) && !e.target.closest('.react-btn'))
            document.getElementById(`ep-${key}`)?.classList.remove('show');
    }, { once: false });
}

async function toggleReaction(key, emoji) {
    if (!currentUser) return;
    const reactRef = ref(db, `chat/${key}/reactions/${currentUser.uid}`);
    const snap = await get(reactRef);
    if (snap.exists() && snap.val() === emoji) {
        await remove(reactRef); // إلغاء التفاعل
    } else {
        await set(reactRef, emoji);
    }
}


/* ============================================================
   Image compression (canvas-based, no upload needed elsewhere)
   ============================================================ */

function compressImageFile(file, { maxDim = 1280, quality = 0.7, mimeType = 'image/jpeg' } = {}) {
    return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) { reject(new Error('ملف غير صالح')); return; }
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                    else { width = Math.round(width * maxDim / height); height = maxDim; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                try {
                    resolve(canvas.toDataURL(mimeType, quality));
                } catch (err) { reject(err); }
            };
            img.onerror = () => reject(new Error('تعذّر تحميل الصورة'));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('تعذّرت قراءة الملف'));
        reader.readAsDataURL(file);
    });
}

async function prepareUpload(file, type) {
    uploadBar.style.display = 'flex';
    uploadText.textContent = 'جاري ضغط الصورة...';
    uploadPreviewImg.src = '';
    sendBtn.disabled = true;
    try {
        const isSticker = type === 'sticker';
        const dataURL = await compressImageFile(file, {
            maxDim: isSticker ? STICKER_MAX_DIM : IMAGE_MAX_DIM,
            quality: isSticker ? STICKER_QUALITY : IMAGE_QUALITY,
            mimeType: isSticker ? 'image/webp' : 'image/jpeg'
        });
        if (dataURL.length > MAX_DATA_LENGTH) {
            alert('الصورة كبيرة حتى بعد الضغط، جرّب صورة أصغر.');
            cancelUpload();
            return;
        }
        pendingUpload = { dataURL, type };
        uploadPreviewImg.src = dataURL;
        const approxKB = Math.round(dataURL.length * 0.75 / 1024);
        uploadText.textContent = isSticker
            ? `ملصق جاهز للإرسال (~${approxKB}kb)`
            : `صورة جاهزة للإرسال (~${approxKB}kb) — يمكنك إضافة تعليق ثم الإرسال`;
        msgInput.focus();
    } catch (err) {
        alert('تعذّر معالجة الصورة');
        cancelUpload();
    } finally {
        sendBtn.disabled = isOnCooldown();
    }
}

}

/* ============================================================
   Send Message (Firebase write helper)
   ============================================================
   بيكتب الرسالة و users/$uid/lastMessageTs في نفس العملية الذرّية
   (atomic multi-path update). قواعد الـ Firebase بترفض أي رسالة
   جديدة إلا لو القيمتين دول متطابقتين وبفاصل 2.9 ثانية عن آخر مرة —
   فمينفعش حد يبعت رسالة من غير ما "يدفع" الفاصل الزمني ده، حتى لو
   استخدم استدعاء مباشر لقاعدة البيانات من برّه الصفحة دي. */
async function sendChatData(data) {
    const newKey = push(ref(db, 'chat')).key;
    const updates = {};
    updates[`chat/${newKey}`] = data;
    updates[`users/${currentUser.uid}/lastMessageTs`] = data.timestamp;
    await update(ref(db), updates);
    return newKey;
}


/* ============================================================
   Send Message
   ============================================================ */

async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text && !pendingUpload) return;
    if (!currentUser) return;

    // Editing an existing message isn't a "new message", so it's exempt from the send cooldown
    if (!editingKey && isOnCooldown()) return;

    if (text.length > MAX_TEXT_LENGTH) {
        alert(`الرسالة طويلة أوي (الحد الأقصى ${MAX_TEXT_LENGTH} حرف)`);
        return;
    }
    if (text && looksLikeCharSpam(text)) {
        alert('الرسالة دي شكلها سبام (نفس الحرف متكرر)، غيّرها وابعتها تاني');
        return;
    }

    sendBtn.disabled = true;

    try {
        if (editingKey) {
            // تعديل رسالة نصيّة (مش خاضع لكولداون الإرسال)
            if (text) await update(ref(db, `chat/${editingKey}`), { text, edited: true });
            editingKey = null;
            msgInput.style.borderColor = '';
            msgInput.placeholder = originalPlaceholder;
        } else if (pendingUpload) {
            const data = {
                userId:    currentUser.uid,
                username:  myUsername,
                type:      pendingUpload.type,
                imageData: pendingUpload.dataURL,
                timestamp: Date.now(),
            };
            if (pendingUpload.type === 'image' && text) data.text = text;
            if (replyTo) {
                data.replyTo = { key: replyTo.key, username: replyTo.username, text: replyTo.text };
                replyTo = null;
                replyBar.style.display = 'none';
            }
            await sendChatData(data);
            cancelUpload();
            startCooldownUI();
        } else {
            // رسالة نصية جديدة
            const data = {
                userId:    currentUser.uid,
                username:  myUsername,
                text,
                timestamp: Date.now(),
            };
            if (replyTo) {
                data.replyTo = { key: replyTo.key, username: replyTo.username, text: replyTo.text };
                replyTo = null;
                replyBar.style.display = 'none';
            }
            await sendChatData(data);
            startCooldownUI();
        }

        msgInput.value = '';
        msgInput.style.height = 'auto';
        clearTyping();
        scrollToBottom();
    } catch (err) {
        console.error('sendMessage failed', err);
    } finally {
        if (!isOnCooldown()) sendBtn.disabled = false;
        msgInput.focus();
    }
}

sendBtn.onclick = sendMessage;

msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

/* ============================================================
   @Mention Autocomplete
   ============================================================ */

function getMentionQuery() {
    const val = msgInput.value;
    const pos = msgInput.selectionStart;
    const upToCaret = val.slice(0, pos);
    const match = upToCaret.match(/(?:^|\s)@([A-Za-z0-9_.\-]*)$/);
    if (!match) return null;
    return { query: match[1], start: pos - match[1].length - 1 };
}

function updateMentionPanel() {
    const m = getMentionQuery();
    if (!m) { mentionPanel.classList.remove('show'); mentionStart = -1; return; }
    const q = m.query.toLowerCase();
    const matches = [...knownUsers.entries()]
        .filter(([uid, name]) => uid !== currentUser?.uid && name.toLowerCase().includes(q))
        .slice(0, 6);
    if (!matches.length) { mentionPanel.classList.remove('show'); mentionStart = -1; return; }
    mentionStart = m.start;
    mentionPanel.innerHTML = matches.map(([, name]) => `
        <div class="mention-item" data-username="${escapeHTML(name)}">
            <div class="mi-avatar">${escapeHTML(name.charAt(0).toUpperCase())}</div>
            <span>${escapeHTML(name)}</span>
        </div>
    `).join('');
    mentionPanel.classList.add('show');
}

mentionPanel.addEventListener('click', e => {
    const item = e.target.closest('.mention-item');
    if (!item || mentionStart < 0) return;
    const username = item.dataset.username;
    const val = msgInput.value;
    const pos = msgInput.selectionStart;
    const before = val.slice(0, mentionStart);
    const after = val.slice(pos);
    const insertion = `@${username} `;
    msgInput.value = before + insertion + after;
    const newPos = (before + insertion).length;
    mentionPanel.classList.remove('show');
    mentionStart = -1;
    msgInput.focus();
    msgInput.setSelectionRange(newPos, newPos);
    autoResize();
});

document.addEventListener('click', e => {
    if (!e.target.closest('#mentionPanel') && !e.target.closest('#msgInput'))
        mentionPanel.classList.remove('show');
});

/* ============================================================
   Image Lightbox (pinch-to-zoom + double-tap zoom + pan)
   ============================================================ */

const imgLightbox   = document.getElementById('imgLightbox');
const lightboxImg   = document.getElementById('lightboxImg');
const lightboxStage = document.getElementById('lightboxStage');

let lbScale = 1;
let lbTranslate = { x: 0, y: 0 };
let lbStartDist = 0;
let lbStartScale = 1;
let lbDragging = false;
let lbDragStart = { x: 0, y: 0 };
let lbStartTranslate = { x: 0, y: 0 };
let lbLastTap = 0;

function resetLightboxTransform() {
    lbScale = 1;
    lbTranslate = { x: 0, y: 0 };
    lightboxImg.style.transform = 'translate(0px,0px) scale(1)';
}

function applyLightboxTransform() {
    lightboxImg.style.transform = `translate(${lbTranslate.x}px, ${lbTranslate.y}px) scale(${lbScale})`;
}

function openLightbox(src) {
    lightboxImg.src = src;
    resetLightboxTransform();
    imgLightbox.classList.add('show');
}

function closeLightbox() {
    imgLightbox.classList.remove('show');
    lightboxImg.src = '';
}

window.openLightbox = openLightbox;

document.getElementById('lightboxClose').addEventListener('click', closeLightbox);

imgLightbox.addEventListener('click', e => {
    if (e.target === imgLightbox) closeLightbox();
});

// Double-tap on the image toggles zoom in/out
lightboxStage.addEventListener('click', e => {
    if (e.target !== lightboxImg) return;
    const now = Date.now();
    if (now - lbLastTap < 300) {
        if (lbScale === 1) lbScale = 2.4;
        else resetLightboxTransform();
        applyLightboxTransform();
    }
    lbLastTap = now;
});

function getTouchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

lightboxStage.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
        lbStartDist = getTouchDist(e.touches);
        lbStartScale = lbScale;
    } else if (e.touches.length === 1 && lbScale > 1) {
        lbDragging = true;
        lbDragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        lbStartTranslate = { ...lbTranslate };
    }
}, { passive: true });

lightboxStage.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
        const dist = getTouchDist(e.touches);
        const ratio = dist / (lbStartDist || dist);
        lbScale = Math.min(Math.max(lbStartScale * ratio, 1), 4);
        applyLightboxTransform();
    } else if (e.touches.length === 1 && lbDragging) {
        const dx = e.touches[0].clientX - lbDragStart.x;
        const dy = e.touches[0].clientY - lbDragStart.y;
        lbTranslate = { x: lbStartTranslate.x + dx, y: lbStartTranslate.y + dy };
        applyLightboxTransform();
    }
}, { passive: true });

lightboxStage.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
        lbDragging = false;
        if (lbScale <= 1.02) resetLightboxTransform();
    }
}, { passive: true });


/* ============================================================
   Sticker Library ("ملصقاتك") — save once, send anytime
   ============================================================ */

const stickerPanel  = document.getElementById('stickerPanel');

async function loadStickers() {

    } catch {

function renderStickerPanel() {

            <img src="${dataURL}" alt="ملصق">

    `).join('');

    stickerGrid.querySelectorAll('.sticker-item').forEach(item => {
        item.addEventListener('click', e => {
            if (e.target.closest('.sticker-del-btn')) return;
            sendStickerDirect(userStickers[item.dataset.id]);
        });
    });

    stickerGrid.querySelectorAll('.sticker-del-btn').forEach(btn => {
        btn.addEventListener('click', async e => {
            e.stopPropagation();
            const id = btn.dataset.id;
            if (!confirm('حذف الملصق ده من ملصقاتك؟')) return;
            delete userStickers[id];
            renderStickerPanel();
            await remove(ref(db, `users/${currentUser.uid}/stickers/${id}`));
        });
    });
}

async function sendStickerDirect(dataURL) {
    if (!currentUser || !dataURL) return;
    if (isOnCooldown()) return; // نفس كولداون الإرسال العادي

    const data = {
        userId:    currentUser.uid,
        username:  myUsername,
        type:      'sticker',
        imageData: dataURL,
        timestamp: Date.now(),
    };
    if (replyTo) {
        data.replyTo = { key: replyTo.key, username: replyTo.username, text: replyTo.text };
        replyTo = null;
        replyBar.style.display = 'none';
    }
    try {
        await sendChatData(data);
        startCooldownUI();
        stickerPanel.classList.remove('show');
        scrollToBottom();
    } catch (err) {
        console.error('sendStickerDirect failed', err);
    }
}

document.getElementById('stickerTrigger').onclick = () => {
    stickerPanel.classList.toggle('show');
    document.getElementById('quickEmojis').classList.remove('show');
};

stickerAddBtn.addEventListener('click', () => stickerInput.click());

document.addEventListener('click', e => {
    if (!e.target.closest('#stickerPanel') && !e.target.closest('#stickerTrigger'))
        stickerPanel.classList.remove('show');
});


/* ============================================================
   Chat Settings — message bubble shape (TikTok-style picker)
   ============================================================ */

const BUBBLE_SHAPES = [
    { id: 'rounded', label: 'دائري (افتراضي)' },
    { id: 'square',  label: 'مربّع' },
    { id: 'pill',    label: 'كبسولة' },
    { id: 'soft',    label: 'ناعم' },
];

const settingsOverlay = document.getElementById('settingsOverlay');
const shapeGrid = document.getElementById('shapeGrid');

function applyBubbleShape(shape) {
    document.body.classList.remove('shape-square', 'shape-pill', 'shape-soft');
    if (shape && shape !== 'rounded') document.body.classList.add('shape-' + shape);
}

async function loadBubbleShape() {
    try {
        const snap = await get(ref(db, `users/${currentUser.uid}/settings/bubbleShape`));
        currentShape = snap.exists() ? snap.val() : 'rounded';
    } catch {
        currentShape = 'rounded';
    }
    applyBubbleShape(currentShape);
    renderShapeGrid();
}

function renderShapeGrid() {
    shapeGrid.innerHTML = BUBBLE_SHAPES.map(s => `
        <div class="shape-option ${currentShape === s.id ? 'active' : ''}" data-shape="${s.id}">
            <div class="shape-preview-bubble p-${s.id}">مرحبا! 👋</div>
            <span class="shape-label">${s.label}</span>
        </div>
    `).join('');

    shapeGrid.querySelectorAll('.shape-option').forEach(opt => {
        opt.addEventListener('click', async () => {
            const shape = opt.dataset.shape;
            currentShape = shape;
            applyBubbleShape(shape);
            renderShapeGrid();
            settingsOverlay.classList.remove('show');
            if (currentUser) {
                try { await set(ref(db, `users/${currentUser.uid}/settings/bubbleShape`), shape); } catch {}
            }
        });
    });
}

document.getElementById('settingsBtn').addEventListener('click', () => {
    settingsOverlay.classList.add('show');
});

document.getElementById('settingsClose').addEventListener('click', () => {
    settingsOverlay.classList.remove('show');
});

settingsOverlay.addEventListener('click', e => {
    if (e.target === settingsOverlay) settingsOverlay.classList.remove('show');
});


/* ============================================================
   Helpers
   ============================================================ */

function escapeHTML(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
