<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>CCRAFT SPACE | NOVA AI</title>
<link rel="stylesheet" href="styles.css">
<style>

:root {
    --nova-primary: #8b5cf6;
    --nova-primary-soft: rgba(139,92,246,0.14);
    --nova-gradient: linear-gradient(135deg, #8b5cf6, #6366f1);
    --nova-gold: #f5c518;
    --nova-gold-soft: rgba(245,197,24,0.14);
    --nova-gold-gradient: linear-gradient(135deg, #f5c518, #e0a800);
    --nova-bg: #0b0c10;
    --nova-surface: #14151c;
    --nova-card: #1a1c25;
    --nova-border: rgba(255,255,255,0.09);
    --nova-text: #eceef2;
    --nova-text-dim: #999cad;
    --nova-success: #4ade80;
    --nova-danger: #f87171;
    --nova-code-bg: #0d0e13;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--nova-bg);
    color: var(--nova-text);
    width: 100%;
    overflow-x: hidden;
}

body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: 'Tajawal', sans-serif;
}

header { flex: none; }

.nova-app {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    width: 100%;
}

.nova-topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--nova-border);
    background: var(--nova-surface);
    flex-wrap: wrap;
}

.icon-btn {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--nova-border);
    background: rgba(255,255,255,0.03);
    color: var(--nova-text);
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin: 0;
    padding: 0;
}
.icon-btn:active { transform: scale(0.94); }

.nova-avatar {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--nova-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    box-shadow: 0 0 14px rgba(139,92,246,0.5);
}

.nova-title-block {
    flex: 1 1 auto;
    min-width: 0;
}
.nova-title-block h1 {
    font-size: 1rem;
    font-weight: 900;
    margin: 0;
    background: var(--nova-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.nova-status {
    font-size: 0.68rem;
    color: var(--nova-success);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
}
.nova-status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--nova-success);
    flex: none;
    animation: blink 1.6s ease infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* --- زر "وضع الأكواد" الذهبي --- */
.code-mode-btn {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--nova-gold-soft);
    border: 1px solid rgba(245,197,24,0.4);
    color: var(--nova-gold);
    border-radius: 50px;
    padding: 8px 14px;
    font-size: 0.78rem;
    font-weight: 900;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    margin: 0;
    white-space: nowrap;
    transition: all 0.15s ease;
}
.code-mode-btn:active { transform: scale(0.96); }
.code-mode-btn.active {
    background: var(--nova-gold-gradient);
    color: #14151c;
    border-color: transparent;
    box-shadow: 0 0 14px rgba(245,197,24,0.45);
}

.sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
}
.sidebar-backdrop.show { opacity: 1; pointer-events: auto; }

.nova-sidebar {
    position: fixed;
    top: 0; bottom: 0; right: 0;
    width: min(300px, 86vw);
    background: var(--nova-surface);
    border-left: 1px solid var(--nova-border);
    z-index: 100;
    display: flex;
    flex-direction: column;
    padding: 14px 12px;
    gap: 10px;
    transform: translateX(100%);
    transition: transform 0.25s ease;
}
.nova-sidebar.open { transform: translateX(0); }

.sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex: none;
}
.sidebar-head span { font-weight: 900; font-size: 0.95rem; }

.new-chat-btn {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--nova-primary-soft);
    border: 1px solid rgba(139,92,246,0.35);
    color: var(--nova-primary);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    margin: 0;
}
.new-chat-btn:active { transform: scale(0.98); }

.conv-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.conv-item {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 0.84rem;
    color: var(--nova-text-dim);
    cursor: pointer;
}
.conv-item:active { background: rgba(255,255,255,0.06); }
.conv-item.active { background: var(--nova-primary-soft); color: var(--nova-text); }
.conv-item .conv-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.conv-item .conv-del {
    flex: none;
    font-size: 0.85rem;
    color: var(--nova-text-dim);
    padding: 4px 8px;
    border-radius: 6px;
}
.conv-item .conv-del:active { color: var(--nova-danger); background: rgba(248,113,113,0.15); }

.sidebar-foot {
    flex: none;
    border-top: 1px solid var(--nova-border);
    padding-top: 10px;
    font-size: 0.68rem;
    color: var(--nova-text-dim);
    text-align: center;
}

.quick-bar {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 10px 12px 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.quick-bar::-webkit-scrollbar { display: none; }

.qp-chip {
    flex: none;
    background: var(--nova-primary-soft);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 50px;
    padding: 8px 15px;
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--nova-primary);
    white-space: nowrap;
    cursor: pointer;
    margin: 0;
    font-family: 'Tajawal', sans-serif;
}
.qp-chip:active { background: rgba(139,92,246,0.25); }

.chat-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.message-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    max-width: 100%;
}
.message-row.user { flex-direction: row-reverse; align-self: flex-end; max-width: 90%; }
.message-row.nova { align-self: flex-start; max-width: 94%; width: 100%; }

.msg-avatar {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    margin-top: 2px;
}
.message-row.user .msg-avatar { background: var(--nova-gradient); color: white; font-weight: 900; }
.message-row.nova .msg-avatar { background: rgba(139,92,246,0.18); border: 1px solid rgba(139,92,246,0.3); }

.msg-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex: 1 1 auto;
}
.message-row.user .msg-col { align-items: flex-end; }
.message-row.nova .msg-col { align-items: flex-start; }

.msg-copy-btn {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: none;
    color: var(--nova-text-dim);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 6px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    margin: 0;
    opacity: 0.75;
}
.msg-copy-btn:active { opacity: 1; transform: scale(0.96); }
.msg-copy-btn.copied { color: var(--nova-success); opacity: 1; }

.msg-bubble {
    min-width: 0;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 0.92rem;
    line-height: 1.7;
    word-break: break-word;
    overflow-wrap: anywhere;
}
.message-row.user .msg-bubble {
    background: var(--nova-gradient);
    color: white;
    border-bottom-left-radius: 4px;
}
.message-row.nova .msg-bubble {
    background: var(--nova-card);
    border: 1px solid var(--nova-border);
    border-bottom-right-radius: 4px;
    direction: rtl;
    text-align: right;
    flex: 1 1 auto;
}

.code-block {
    direction: ltr;
    text-align: left;
    background: var(--nova-code-bg);
    border: 1px solid var(--nova-border);
    border-radius: 12px;
    margin: 10px 0;
    overflow: hidden;
    max-width: 100%;
}
.code-block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--nova-border);
    font-family: 'Consolas', monospace;
    font-size: 0.7rem;
    color: var(--nova-text-dim);
}
.copy-btn {
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(139,92,246,0.15);
    border: 1px solid rgba(139,92,246,0.3);
    color: var(--nova-primary);
    border-radius: 7px;
    padding: 6px 11px;
    font-size: 0.72rem;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    margin: 0;
}
.copy-btn.copied { background: rgba(74,222,128,0.18); border-color: rgba(74,222,128,0.4); color: var(--nova-success); }

.code-block pre {
    margin: 0;
    padding: 13px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
}
.code-block code {
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #d6d6e2;
    white-space: pre;
}

.inline-code {
    background: rgba(139,92,246,0.18);
    padding: 2px 6px;
    border-radius: 5px;
    font-family: 'Consolas', monospace;
    font-size: 0.85em;
    direction: ltr;
    display: inline-block;
}

.typing-dots { display: flex; gap: 5px; padding: 3px 0; }
.typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--nova-primary);
    animation: bounce 1.2s ease infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-5px);opacity:1} }

.welcome-block {
    margin: auto 0;
    text-align: center;
    padding: 6vh 16px;
    color: var(--nova-text-dim);
}
.welcome-block .w-icon { font-size: 2.3rem; display: block; margin-bottom: 10px; }
.welcome-block h2 {
    font-size: 1.25rem;
    font-weight: 900;
    margin: 0 0 6px;
    background: var(--nova-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.welcome-block p { font-size: 0.85rem; line-height: 1.7; max-width: 380px; margin: 0 auto; }

.input-bar {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--nova-border);
    background: var(--nova-surface);
}

#userInput {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--nova-card);
    border: 1px solid var(--nova-border);
    border-radius: 16px;
    padding: 12px 15px;
    color: var(--nova-text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.92rem;
    outline: none;
    resize: none;
    max-height: 110px;
    line-height: 1.5;
    direction: rtl;
    margin: 0;
}
#userInput::placeholder { color: var(--nova-text-dim); }
#userInput:focus { border-color: var(--nova-primary); }

#sendBtn {
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--nova-gradient);
    color: white;
    border: none;
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    box-shadow: 0 4px 14px rgba(139,92,246,0.35);
}
#sendBtn:active { transform: scale(0.92); }
#sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

#micBtn {
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--nova-card);
    border: 1px solid var(--nova-border);
    color: var(--nova-text-dim);
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    transition: all 0.15s ease;
}
#micBtn:active { transform: scale(0.92); }
#micBtn.listening {
    background: var(--nova-gradient);
    color: white;
    border-color: transparent;
    animation: micPulse 1.2s infinite;
}
@keyframes micPulse {
    0%   { box-shadow: 0 0 0 0 rgba(139,92,246,0.55); }
    70%  { box-shadow: 0 0 0 12px rgba(139,92,246,0); }
    100% { box-shadow: 0 0 0 0 rgba(139,92,246,0); }
}

.mod-badge {
    display: none;
    flex: none;
    background: rgba(74,222,128,0.12);
    border: 1px solid rgba(74,222,128,0.3);
    border-radius: 50px;
    padding: 4px 10px;
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--nova-success);
    white-space: nowrap;
}
.mod-badge.show { display: inline-flex; align-items: center; gap: 4px; }

.world-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 500;
    flex-direction: column;
}
.world-modal.open { display: flex; }
.world-toolbar {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-top));
    background: rgba(10,10,20,0.96);
    border-bottom: 1px solid var(--nova-border);
}
.world-title { flex: 1 1 auto; min-width: 0; font-size: 0.88rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.world-close {
    flex: none;
    background: rgba(248,113,113,0.12);
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--nova-danger);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    margin: 0;
}
#worldFrame { flex: 1 1 auto; min-height: 0; border: none; background: white; width: 100%; }

.video-cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    width: 100%;
}
.video-cards-loading {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px;
    font-size: 0.8rem;
    color: var(--nova-text-dim);
}
.video-card {
    display: flex;
    align-items: stretch;
    gap: 10px;
    background: var(--nova-code-bg);
    border: 1px solid var(--nova-border);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: var(--nova-text);
    cursor: pointer;
}
.video-card:active { background: rgba(255,255,255,0.04); }
.video-card .vc-thumb-wrap {
    flex: none;
    position: relative;
    width: 120px;
}
.video-card .vc-thumb {
    width: 120px;
    height: 100%;
    min-height: 78px;
    object-fit: cover;
    display: block;
}
.video-card .vc-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.25);
    font-size: 1.4rem;
    color: white;
}
.video-card .vc-info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    padding: 8px 10px 8px 4px;
}
.video-card .vc-title {
    font-size: 0.82rem;
    font-weight: 800;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.video-card .vc-channel {
    font-size: 0.72rem;
    color: var(--nova-text-dim);
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.video-player-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 10px;
    background: #000;
}
.video-player-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
}

/* --- بطاقة ملف الكود --- */
.code-file-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--nova-code-bg);
    border: 1px solid rgba(245,197,24,0.3);
    border-radius: 12px;
    padding: 10px 12px;
    margin-top: 10px;
    width: 100%;
    cursor: pointer;
}
.code-file-card:active { background: rgba(245,197,24,0.06); }
.cf-icon {
    flex: none;
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--nova-gold-soft);
    color: var(--nova-gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
}
.cf-info { flex: 1 1 auto; min-width: 0; }
.cf-name {
    font-size: 0.85rem;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.cf-lang { font-size: 0.7rem; color: var(--nova-text-dim); }
.cf-open {
    flex: none;
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--nova-gold);
}

.code-file-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 500;
    flex-direction: column;
}
.code-file-modal.open { display: flex; }
.cf-toolbar {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-top));
    background: rgba(10,10,20,0.96);
    border-bottom: 1px solid var(--nova-border);
    flex-wrap: wrap;
}
.cf-title { flex: 1 1 auto; min-width: 0; font-size: 0.85rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf-action-btn {
    flex: none;
    display: flex; align-items: center; gap: 5px;
    border-radius: 10px;
    padding: 8px 13px;
    font-size: 0.78rem;
    font-weight: 800;
    cursor: pointer;
    margin: 0;
    font-family: 'Tajawal', sans-serif;
    border: 1px solid transparent;
}
.cf-download-btn { background: var(--nova-gold-soft); border-color: rgba(245,197,24,0.4); color: var(--nova-gold); }
.cf-copy-btn { background: rgba(139,92,246,0.15); border-color: rgba(139,92,246,0.3); color: var(--nova-primary); }
.cf-copy-btn.copied { background: rgba(74,222,128,0.18); border-color: rgba(74,222,128,0.4); color: var(--nova-success); }
.cf-close-btn { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.3); color: var(--nova-danger); }
.cf-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
    direction: ltr;
    text-align: left;
}
.cf-body pre { margin: 0; }
.cf-body code {
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    color: #d6d6e2;
    white-space: pre;
}

.nova-toast {
    position: fixed;
    bottom: calc(78px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(50px);
    background: var(--nova-card);
    border: 1px solid var(--nova-primary);
    border-radius: 50px;
    padding: 9px 20px;
    font-size: 0.82rem;
    font-weight: 800;
    z-index: 400;
    transition: transform 0.3s ease;
    max-width: 88vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
}
.nova-toast.show { transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>

<header>
    <button class="nav-button" onclick="location.href='index.html'">رجوع للصفحة الرئيسية</button>
</header>

<div class="nova-app">

    <div class="nova-topbar">
        <button class="icon-btn" id="sidebarBtn" onclick="toggleSidebar()">☰</button>
        <div class="nova-avatar">🤖</div>
        <div class="nova-title-block">
            <h1>NOVA AI</h1>
            <div class="nova-status" id="novaStatus">جاري الاتصال...</div>
        </div>
        <button class="code-mode-btn" id="codeModeBtn" onclick="toggleCodeMode()" title="تفعيل وضع الأكواد الاحترافي">
            💛 وضع الأكواد
        </button>
        <span class="mod-badge" id="modBadge">🎨 معدّلة</span>
        <button class="icon-btn" onclick="clearMemory()" title="مسح الذاكرة">🗑️</button>
    </div>

    <div class="quick-bar">
        <button class="qp-chip" onclick="quickSend('اصنع لي لعبة تجنب العقبات')">🎮 لعبة تجنب عقبات</button>
        <button class="qp-chip" onclick="quickSend('اصنع عالم فضائي تفاعلي')">🌌 عالم فضائي</button>
        <button class="qp-chip" onclick="quickSend('غيّر خلفية الصفحة لأزرق داكن')">🎨 غيّر الخلفية</button>
        <button class="qp-chip" onclick="quickSend('اكتب سكربت لوحة تسجيل نقاط بالجافاسكريبت')">💻 سكربت جافاسكريبت</button>
        <button class="qp-chip" onclick="quickSend('ابعتلي فيديوهات عن الأكل')">🎬 فيديوهات</button>
    </div>

    <div class="chat-scroll" id="chatScroll"></div>

    <div class="input-bar">
        <textarea id="userInput" rows="1" placeholder="اكتب لـ Nova..."></textarea>
        <button id="micBtn" type="button" title="تحدث بدل الكتابة">🎤</button>
        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
    <aside class="nova-sidebar" id="novaSidebar">
        <div class="sidebar-head">
            <span>المحادثات</span>
            <button class="icon-btn" onclick="toggleSidebar(false)" style="width:32px;height:32px;font-size:0.9rem;">✕</button>
        </div>
        <button class="new-chat-btn" onclick="newConversation()">➕ محادثة جديدة</button>
        <div class="conv-list" id="convList"></div>
        <div class="sidebar-foot">Nova AI — بواسطة cCraft Space</div>
    </aside>

</div>

<div class="world-modal" id="worldModal">
    <div class="world-toolbar">
        <span class="world-title" id="worldTitle">عالم Nova</span>
        <button class="world-close" onclick="closeWorld()">✕ إغلاق</button>
    </div>
    <iframe id="worldFrame" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<div class="code-file-modal" id="codeFileModal">
    <div class="cf-toolbar">
        <span class="cf-title" id="cfTitle">كود.txt</span>
        <button class="cf-action-btn cf-download-btn" id="cfDownloadBtn">⬇️ تحميل</button>
        <button class="cf-action-btn cf-copy-btn" id="cfCopyBtn">📋 نسخ</button>
        <button class="cf-action-btn cf-close-btn" onclick="closeCodeFile()">✕ إغلاق</button>
    </div>
    <div class="cf-body">
        <pre><code id="cfCode"></code></pre>
    </div>
</div>

<div class="nova-toast" id="novaToast"></div>


<script>
const NOVA_URL = "https://ghgh62131r.pythonanywhere.com";

const chatScroll   = document.getElementById('chatScroll');
const userInput    = document.getElementById('userInput');
const sendBtn      = document.getElementById('sendBtn');
const novaSidebar  = document.getElementById('novaSidebar');
const sidebarBack  = document.getElementById('sidebarBackdrop');
const codeModeBtn  = document.getElementById('codeModeBtn');

let userId = localStorage.getItem('novaUserId');
if (!userId) {
    userId = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('novaUserId', userId);
}
const userIcon = (localStorage.getItem('currentUser') || '').charAt(0).toUpperCase() || 'أ';

const CONV_KEY = 'novaConversations_' + userId;
const ACTIVE_KEY = 'novaActiveConv_' + userId;

let conversations = loadConversations();
let activeConvId = localStorage.getItem(ACTIVE_KEY);

// وضع الأكواد الاحترافي (زر ذهبي) — بيتفعّل يدويًا وبيتبعت مع كل رسالة
let codeModeActive = localStorage.getItem('novaCodeMode') === '1';

function loadConversations() {
    try {
        const raw = localStorage.getItem(CONV_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch { return []; }
}
function saveConversations() { localStorage.setItem(CONV_KEY, JSON.stringify(conversations)); }
function sessionKeyFor(convId) { return userId + '::' + convId; }

function createConversation() {
    const conv = { id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8), title: 'محادثة جديدة', messages: [] };
    conversations.unshift(conv);
    saveConversations();
    return conv;
}

function newConversation() {
    const conv = createConversation();
    setActiveConversation(conv.id);
    toggleSidebar(false);
}

function setActiveConversation(id) {
    activeConvId = id;
    localStorage.setItem(ACTIVE_KEY, id);
    renderSidebar();
    renderChat();
}

function getActiveConversation() { return conversations.find(c => c.id === activeConvId); }

function deleteConversation(id, evt) {
    evt.stopPropagation();
    if (!confirm('حذف المحادثة دي نهائيًا؟')) return;
    conversations = conversations.filter(c => c.id !== id);
    saveConversations();
    fetch(`${NOVA_URL}/clear/${encodeURIComponent(sessionKeyFor(id))}`, { method: 'DELETE' }).catch(() => {});

    if (activeConvId === id) {
        conversations.length ? setActiveConversation(conversations[0].id) : newConversation();
    } else {
        renderSidebar();
    }
}

function renderSidebar() {
    const list = document.getElementById('convList');
    list.innerHTML = '';
    conversations.forEach(conv => {
        const item = document.createElement('div');
        item.className = 'conv-item' + (conv.id === activeConvId ? ' active' : '');
        item.onclick = () => { setActiveConversation(conv.id); toggleSidebar(false); };

        const title = document.createElement('span');
        title.className = 'conv-title';
        title.innerText = conv.title || 'محادثة جديدة';

        const del = document.createElement('span');
        del.className = 'conv-del';
        del.innerText = '✕';
        del.onclick = (e) => deleteConversation(conv.id, e);

        item.appendChild(title);
        item.appendChild(del);
        list.appendChild(item);
    });
}

function toggleSidebar(force) {
    const open = force !== undefined ? force : !novaSidebar.classList.contains('open');
    novaSidebar.classList.toggle('open', open);
    sidebarBack.classList.toggle('show', open);
}

/* --- تفعيل/تعطيل وضع الأكواد --- */
function toggleCodeMode() {
    codeModeActive = !codeModeActive;
    localStorage.setItem('novaCodeMode', codeModeActive ? '1' : '0');
    updateCodeModeUI();
    showToast(codeModeActive ? '💛 وضع الأكواد الاحترافي مفعّل' : 'تم إلغاء وضع الأكواد');
}
function updateCodeModeUI() {
    codeModeBtn.classList.toggle('active', codeModeActive);
}
updateCodeModeUI();

function renderChat() {
    chatScroll.innerHTML = '';
    const conv = getActiveConversation();

    if (!conv || conv.messages.length === 0) {
        chatScroll.innerHTML = `
            <div class="welcome-block">
                <span class="w-icon">🤖</span>
                <h2>أهلاً، أنا Nova</h2>
                <p>ذكاء CCRAFT SPACE. أتذكر المحادثة، أتحكم في الصفحة، وأجيبلك فيديوهات يوتيوب، وأكتبلك أكواد جاهزة بشكل مرتب ✨</p>
            </div>`;
        return;
    }

    conv.messages.forEach(m => {
        const row = appendMessage(m.text, m.sender);
        if (m.videos && m.videos.length) renderVideoCards(row, m.videos);
        if (m.codeFile) renderCodeFileCard(row, m.codeFile);
    });
    scrollToBottom();
}

function scrollToBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }

function appendMessage(text, sender) {
    chatScroll.querySelector('.welcome-block')?.remove();

    const row = document.createElement('div');
    row.className = 'message-row ' + sender;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerText = sender === 'user' ? userIcon : '🤖';

    const col = document.createElement('div');
    col.className = 'msg-col';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = sender === 'nova' ? renderRichText(text) : escapeHtml(text);

    const msgCopyBtn = document.createElement('button');
    msgCopyBtn.className = 'msg-copy-btn';
    msgCopyBtn.innerHTML = '<span class="mc-icon">📋</span><span class="mc-text">نسخ الرسالة</span>';
    msgCopyBtn.onclick = () => copyToClipboard(text, msgCopyBtn, '.mc-icon', '.mc-text', 'نسخ الرسالة');

    col.appendChild(bubble);
    col.appendChild(msgCopyBtn);

    row.appendChild(avatar);
    row.appendChild(col);
    chatScroll.appendChild(row);
    return row;
}

function copyToClipboard(text, btn, iconSel, textSel, resetLabel) {
    const icon = btn.querySelector(iconSel);
    const label = btn.querySelector(textSel);
    const done = () => {
        btn.classList.add('copied');
        icon.innerText = '✅';
        label.innerText = 'تم النسخ';
        setTimeout(() => {
            btn.classList.remove('copied');
            icon.innerText = '📋';
            label.innerText = resetLabel;
        }, 1600);
    };
    if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
        fallbackCopy(text, done);
    }
}

function renderRichText(text) {
    const blocks = [];
    let working = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
        blocks.push({ lang: (lang || 'code').trim(), code: code.replace(/\n$/, '') });
        return `%%CB${blocks.length - 1}%%`;
    });

    working = escapeHtml(working)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+?)`/g, '<span class="inline-code">$1</span>')
        .replace(/\n/g, '<br>');

    working = working.replace(/%%CB(\d+)%%/g, (m, i) => buildCodeBlock(blocks[+i]));
    return working;
}

function escapeHtml(str) {
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
}

function buildCodeBlock(block) {
    const encoded = encodeURIComponent(block.code);
    return `
        <div class="code-block">
            <div class="code-block-head">
                <span>${escapeHtml(block.lang)}</span>
                <button class="copy-btn" data-code="${encoded}" onclick="copyCode(this)">
                    <span class="ci">📋</span><span class="ct">نسخ</span>
                </button>
            </div>
            <pre><code>${escapeHtml(block.code)}</code></pre>
        </div>`;
}

function copyCode(btn) {
    const code = decodeURIComponent(btn.getAttribute('data-code'));
    const done = () => {
        btn.classList.add('copied');
        btn.querySelector('.ci').innerText = '✅';
        btn.querySelector('.ct').innerText = 'تم';
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.querySelector('.ci').innerText = '📋';
            btn.querySelector('.ct').innerText = 'نسخ';
        }, 1600);
    };
    if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
    } else {
        fallbackCopy(code, done);
    }
}

function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); cb(); } catch {}
    document.body.removeChild(ta);
}

function showTyping() {
    chatScroll.querySelector('.welcome-block')?.remove();
    const row = document.createElement('div');
    row.className = 'message-row nova';
    row.id = 'typingRow';
    row.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    chatScroll.appendChild(row);
    scrollToBottom();
}
function removeTyping() { document.getElementById('typingRow')?.remove(); }


function executeDomCommand(cmd) {
    try {
        if (cmd.startsWith('bg:')) { document.body.style.background = cmd.slice(3).trim(); showToast('🎨 تم تغيير الخلفية'); showModBadge(); return; }
        if (cmd.startsWith('add:')) {
            const div = document.createElement('div');
            div.innerHTML = cmd.slice(4).trim();
            div.style.cssText = 'position:fixed;top:70px;right:16px;z-index:300;';
            document.body.appendChild(div);
            showToast('✅ تم إضافة العنصر'); showModBadge(); return;
        }
        if (cmd.startsWith('js:')) {
            const safe = cmd.slice(3).trim()
                .replace(/fetch\(/g, '').replace(/XMLHttpRequest/g, '')
                .replace(/location\.href/g, '').replace(/window\.open/g, '');
            eval(safe);
            showToast('⚡ تم تنفيذ الأمر'); showModBadge(); return;
        }
        if (cmd.startsWith('text:')) {
            const parts = cmd.slice(5).split(':');
            const el = document.querySelector(parts[0]);
            if (el) { el.innerText = parts.slice(1).join(':'); showToast('✏️ تم تغيير النص'); showModBadge(); }
            return;
        }
        if (cmd.startsWith('hide:')) {
            const el = document.querySelector(cmd.slice(5));
            if (el) { el.style.display = 'none'; showToast('👁️ تم إخفاء العنصر'); showModBadge(); }
            return;
        }
        if (cmd.startsWith('toast:')) { showToast(cmd.slice(6)); return; }
    } catch (e) { console.error('DOM command error:', e); }
}

function openWorld(worldData) {
    document.getElementById('worldTitle').innerText = worldData.title || 'عالم Nova';
    document.getElementById('worldFrame').srcdoc = worldData.html || '<p>فارغ</p>';
    document.getElementById('worldModal').classList.add('open');
}
function closeWorld() {
    document.getElementById('worldModal').classList.remove('open');
    document.getElementById('worldFrame').srcdoc = '';
}

/* ================================================================
   بطاقة ملف الكود (وضع الأكواد) — فتح / تحميل / نسخ
   ================================================================ */
function renderCodeFileCard(row, fileData) {
    const col = row.querySelector('.msg-col');
    if (!col) return;
    if (col.querySelector('.code-file-card')) return;

    const ext = guessExtension(fileData.language, fileData.filename);
    const filename = fileData.filename || ('nova-code' + ext);

    const card = document.createElement('div');
    card.className = 'code-file-card';
    card.innerHTML = `
        <div class="cf-icon">📄</div>
        <div class="cf-info">
            <div class="cf-name">${escapeHtml(filename)}</div>
            <div class="cf-lang">${escapeHtml(fileData.language || 'code')}</div>
        </div>
        <div class="cf-open">فتح الملف ›</div>`;
    card.onclick = () => openCodeFile(filename, fileData.language || '', fileData.code || '');

    const copyBtn = col.querySelector('.msg-copy-btn');
    col.insertBefore(card, copyBtn || null);
    scrollToBottom();
}

function guessExtension(language, filename) {
    if (filename && filename.includes('.')) return '';
    const map = { lua: '.lua', luau: '.lua', javascript: '.js', js: '.js', html: '.html', css: '.css', python: '.py', json: '.json' };
    return map[(language || '').toLowerCase()] || '.txt';
}

let currentCodeFile = null;

function openCodeFile(filename, language, code) {
    if (filename && !filename.includes('.')) filename += guessExtension(language, filename);
    currentCodeFile = { filename: filename || 'nova-code.txt', code: code || '' };

    document.getElementById('cfTitle').innerText = currentCodeFile.filename;
    document.getElementById('cfCode').innerText = currentCodeFile.code;
    document.getElementById('codeFileModal').classList.add('open');

    const downloadBtn = document.getElementById('cfDownloadBtn');
    const copyBtn = document.getElementById('cfCopyBtn');

    downloadBtn.onclick = () => downloadCodeFile(currentCodeFile.filename, currentCodeFile.code);
    copyBtn.onclick = () => {
        copyToClipboard(currentCodeFile.code, copyBtn, null, null, null);
        // نسخ مباشر بدون الاعتماد على selectors داخلية للزرار ده
        const done = () => {
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = '✅ تم النسخ';
            setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = '📋 نسخ'; }, 1600);
        };
        if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(currentCodeFile.code).then(done).catch(() => fallbackCopy(currentCodeFile.code, done));
        } else {
            fallbackCopy(currentCodeFile.code, done);
        }
    };
}

function closeCodeFile() {
    document.getElementById('codeFileModal').classList.remove('open');
}

function downloadCodeFile(filename, code) {
    const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('⬇️ جاري تحميل الملف');
}

async function fetchAndRenderVideos(row, query) {
    const col = row.querySelector('.msg-col');
    if (!col) return;

    const loadingEl = document.createElement('div');
    loadingEl.className = 'video-cards-loading';
    loadingEl.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div> جاري البحث عن فيديوهات...`;
    col.appendChild(loadingEl);
    scrollToBottom();

    try {
        const res = await fetch(`${NOVA_URL}/search-videos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, max_results: 6 })
        });
        const data = await res.json();
        loadingEl.remove();

        if (!res.ok || !data.videos || !data.videos.length) {
            const err = document.createElement('div');
            err.className = 'video-cards-loading';
            err.innerText = '⚠️ مقدرتش ألاقي فيديوهات دلوقتي';
            col.appendChild(err);
            scrollToBottom();
            return;
        }

        renderVideoCards(row, data.videos);

        const conv = getActiveConversation();
        if (conv) {
            const last = conv.messages[conv.messages.length - 1];
            if (last && last.sender === 'nova') last.videos = data.videos;
            saveConversations();
        }
    } catch (e) {
        loadingEl.remove();
        const err = document.createElement('div');
        err.className = 'video-cards-loading';
        err.innerText = '⚠️ في مشكلة في الاتصال بخدمة الفيديو';
        col.appendChild(err);
        scrollToBottom();
    }
}

function renderVideoCards(row, videos) {
    const col = row.querySelector('.msg-col');
    if (!col) return;
    if (col.querySelector('.video-cards')) return;

    const wrap = document.createElement('div');
    wrap.className = 'video-cards';

    videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
            <div class="vc-thumb-wrap">
                <img class="vc-thumb" src="${escapeHtml(v.thumbnail)}" alt="" loading="lazy">
                <div class="vc-play">▶️</div>
            </div>
            <div class="vc-info">
                <div class="vc-title">${escapeHtml(v.title)}</div>
                <div class="vc-channel">📺 ${escapeHtml(v.channel || '')}</div>
            </div>`;
        card.onclick = () => playVideoInline(card, v);
        wrap.appendChild(card);
    });

    const copyBtn = col.querySelector('.msg-copy-btn');
    col.insertBefore(wrap, copyBtn || null);
    scrollToBottom();
}

function playVideoInline(cardEl, video) {
    const wrap = cardEl.closest('.video-cards');
    wrap.querySelectorAll('.video-player-wrap').forEach(el => el.remove());

    const player = document.createElement('div');
    player.className = 'video-player-wrap';
    player.innerHTML = `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(video.videoId)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    cardEl.insertAdjacentElement('afterend', player);
    scrollToBottom();
}

function showToast(msg) {
    const t = document.getElementById('novaToast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}
function showModBadge() { document.getElementById('modBadge').classList.add('show'); }

async function sendMessage() {
    const msg = userInput.value.trim();
    if (!msg) return;

    let conv = getActiveConversation();
    if (!conv) { conv = createConversation(); activeConvId = conv.id; }
    if (conv.messages.length === 0) conv.title = msg.length > 32 ? msg.slice(0, 32) + '…' : msg;

    conv.messages.push({ text: msg, sender: 'user' });
    saveConversations();
    renderSidebar();

    appendMessage(msg, 'user');
    userInput.value = '';
    autoResize();
    scrollToBottom();
    sendBtn.disabled = true;
    showTyping();

    const pageCtx = `الصفحة: nova.html | عنوان الصفحة: ${document.title}`;

    try {
        const res = await fetch(`${NOVA_URL}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: msg,
                user_id: sessionKeyFor(conv.id),
                page_context: pageCtx,
                code_mode: codeModeActive
            })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        removeTyping();

        let novaRow = null;
        if (data.reply) {
            novaRow = appendMessage(data.reply, 'nova');
            conv.messages.push({ text: data.reply, sender: 'nova' });
            saveConversations();
            scrollToBottom();
        }

        if (data.type === 'dom' && data.dom_command) executeDomCommand(data.dom_command);

        if (data.type === 'world' && data.world) {
            setTimeout(() => {
                const btn = document.createElement('button');
                btn.style.cssText = `background:var(--nova-gradient);color:white;border:none;border-radius:50px;padding:9px 18px;font-size:0.8rem;font-weight:800;cursor:pointer;font-family:Tajawal,sans-serif;margin-top:8px;`;
                btn.innerText = `🌍 افتح ${data.world.title || 'العالم'}`;
                btn.onclick = () => openWorld(data.world);
                const lastBubble = chatScroll.querySelector('.message-row.nova:last-child .msg-bubble');
                if (lastBubble) { lastBubble.appendChild(document.createElement('br')); lastBubble.appendChild(btn); }
            }, 100);
        }

        if (data.type === 'video' && data.videos && data.videos.length) {
            if (novaRow) {
                renderVideoCards(novaRow, data.videos);
                const last = conv.messages[conv.messages.length - 1];
                if (last) last.videos = data.videos;
                saveConversations();
            }
        }
        else if (data.type === 'video' && data.video_query) {
            if (novaRow) fetchAndRenderVideos(novaRow, data.video_query);
        }

        if (data.type === 'code_file' && data.code) {
            const fileData = { filename: data.filename, language: data.language, code: data.code };
            if (novaRow) {
                renderCodeFileCard(novaRow, fileData);
                const last = conv.messages[conv.messages.length - 1];
                if (last) last.codeFile = fileData;
                saveConversations();
            }
        }
    } catch (e) {
        removeTyping();
        appendMessage(`عذراً، حدث خطأ 😢 — ${e.message}`, 'nova');
        scrollToBottom();
    } finally {
        sendBtn.disabled = false;
        userInput.focus();
    }
}

function quickSend(text) { userInput.value = text; sendMessage(); }

async function clearMemory() {
    const conv = getActiveConversation();
    if (!conv) return;
    if (!confirm('مسح ذاكرة المحادثة الحالية؟')) return;
    try { await fetch(`${NOVA_URL}/clear/${encodeURIComponent(sessionKeyFor(conv.id))}`, { method: 'DELETE' }); } catch {}
    conv.messages = [];
    conv.title = 'محادثة جديدة';
    saveConversations();
    renderSidebar();
    renderChat();
    document.getElementById('modBadge').classList.remove('show');
    showToast('🗑️ تم مسح الذاكرة');
}

function autoResize() {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
}

userInput.addEventListener('input', autoResize);
userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

/* ================================================================
   الإدخال الصوتي (Web Speech API)
   ================================================================ */
(function () {
    const micBtn = document.getElementById('micBtn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        micBtn.style.display = 'none';
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'ar-EG';
    recognition.continuous = false;
    recognition.interimResults = true;

    let isListening = false;

    micBtn.addEventListener('click', () => {
        if (isListening) { recognition.stop(); return; }
        try { recognition.start(); } catch (e) { console.error(e); }
    });

    recognition.addEventListener('start', () => {
        isListening = true;
        micBtn.classList.add('listening');
        micBtn.innerText = '⏺️';
    });

    recognition.addEventListener('end', () => {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerText = '🎤';
    });

    recognition.addEventListener('result', (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        userInput.value = transcript;
        autoResize();
    });

    recognition.addEventListener('error', (event) => {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerText = '🎤';
        if (event.error === 'not-allowed') {
            showToast('⚠️ لازم تسمح بالوصول للمايك');
        }
    });
})();

(function init() {
    if (conversations.length === 0) {
        const conv = createConversation();
        activeConvId = conv.id;
    } else if (!activeConvId || !conversations.find(c => c.id === activeConvId)) {
        activeConvId = conversations[0].id;
    }
    renderSidebar();
    renderChat();
})();

(async () => {
    try {
        const res = await fetch(`${NOVA_URL}/status`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('novaStatus').innerText = `متصل — ${data.model?.split('/').pop() || 'Gemini'}`;
    } catch {
        const s = document.getElementById('novaStatus');
        s.innerText = '⚠️ تحقق من الاتصال';
        s.style.color = 'var(--nova-danger)';
    }
})();
</script>
